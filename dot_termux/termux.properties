### Termux 终端配置 (由 Chezmoi 自动纳管)
### 针对 Vim、Tmux 触屏移动端操作优化的双行扩展功能按键栏

# 快捷键虚拟扩展栏 (两行布局：第一行导航与常用符号，第二行控制键与方向键)
extra-keys = [ \
  ['ESC', '/', '-', 'HOME', 'UP', 'END', 'PGUP', 'DEL'], \
  ['TAB', 'CTRL', 'ALT', 'LEFT', 'DOWN', 'RIGHT', 'PGDN', 'ENTER'] \
]

# 屏蔽终端振动铃声干扰
bell-character = ignore

# 默认不强制隐藏软键盘
hide-soft-keyboard-on-startup = false
