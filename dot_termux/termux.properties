### Termux 终端配置 (由 Chezmoi 自动纳管)
### 针对 Vim、Tmux 触屏移动端操作优化的双行扩展功能按键栏

# 快捷键虚拟扩展栏 (两行 8 列对称布局：剔除冗余 ENTER，补齐管道符与家目录，右侧导航对齐)
extra-keys = [ \
  ['ESC', '/', '-', '|', '~', 'HOME', 'UP', 'END'], \
  ['TAB', 'CTRL', 'ALT', ':', 'DEL', 'LEFT', 'DOWN', 'RIGHT'] \
]

# 屏蔽终端振动铃声干扰
bell-character = ignore

# 默认不强制隐藏软键盘
hide-soft-keyboard-on-startup = false
